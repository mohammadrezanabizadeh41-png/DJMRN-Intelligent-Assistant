# Manual-only: no automatic push, schedule, PR triggers, and no privileged repository token.
name: DJMRN P2C pinned Bifrost synthetic-only manual CI
on:
  workflow_dispatch:
    inputs:
      billing_guard_confirmed:
        description: 'I confirmed this is a public repository using free standard ubuntu-latest Actions'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: djmrn-p2c-manual
  cancel-in-progress: false
jobs:
  pinned-synthetic-gateway:
    if: ${{ inputs.billing_guard_confirmed == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DJMRN_APPROVED_FREE_ACTIONS_MINUTES: 'yes'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 pinned SHA
      - name: Check offline source controls first
        run: |
          cd 06-tests-and-evidence/pilots/ROUTER-P002C-20261023
          python3 -W error::ResourceWarning -m unittest -v test_p2c_preflight.py
      - name: Run ONLY pinned real Bifrost plus synthetic mock HTTP servers
        shell: bash
        run: |
          bash 06-tests-and-evidence/pilots/ROUTER-P002C-20261023/run_ci.sh
