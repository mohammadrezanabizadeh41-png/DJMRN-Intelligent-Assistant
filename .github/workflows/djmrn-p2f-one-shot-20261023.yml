name: DJMRN P2F one-shot isolated synthetic boundary test
on:
  workflow_dispatch:
    inputs:
      synthetic_only:
        description: 'I approve bounded synthetic-only OCI Bifrost with fake providers on public standard runner'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: djmrn-p2f-once
  cancel-in-progress: false
jobs:
  isolated-p2f:
    if: ${{ inputs.synthetic_only == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DJMRN_APPROVED_FREE_ACTIONS_MINUTES: 'yes'
      DJMRN_P2E_SYNTHETIC_INTEGRATION: 'yes'
      DJMRN_P2F_SYNTHETIC_INTEGRATION: 'yes'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: P2C preflight (fake providers only)
        working-directory: 06-tests-and-evidence/pilots/ROUTER-P002C-20261023
        run: python3 -W error::ResourceWarning -m unittest -v test_p2c_preflight.py
      - name: P2D source quota tests
        working-directory: 06-tests-and-evidence/pilots/ROUTER-P002D-20261023
        run: python3 -W error::ResourceWarning -m unittest -v test_admission.py
      - name: P2E source admission tests
        working-directory: 06-tests-and-evidence/pilots/ROUTER-P002E-20261023
        env:
          PYTHONPATH: ../ROUTER-P002D-20261023
        run: python3 -W error::ResourceWarning -m unittest -v test_integration.py
      - name: P2F source/restart rejection tests
        working-directory: 06-tests-and-evidence/pilots/ROUTER-P002F-20261023
        env:
          PYTHONPATH: ../ROUTER-P002D-20261023:../ROUTER-P002E-20261023
        run: python3 -W error::ResourceWarning -m unittest -v test_guard.py
      - name: Run pinned real Bifrost + two segregated synthetic Docker networks
        shell: bash
        run: bash 06-tests-and-evidence/pilots/ROUTER-P002C-20261023/run_ci.sh
